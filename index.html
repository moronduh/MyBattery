<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MyBattery</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#5a7a5a" />
    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MyBattery" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- Apply dark mode before first paint to prevent layout flash on load/restore -->
    <script>
      try {
        var dark = localStorage.getItem('reflow-dark-mode') === 'true';
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch(e) {}
    </script>
    <style>
      /* Prevent iOS Safari horizontal momentum scroll causing centering issues */
      html, body { overflow-x: hidden; touch-action: pan-y; max-width: 100%; }
      body { overflow-x: clip; } /* clip, not hidden: hidden makes body a scroll container and breaks the sticky header */
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
